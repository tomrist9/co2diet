spring:
  application:
    name: co2diet-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/co2diet
    username: co2diet
    password: co2diettt
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/co2diet

server:
  port: 8080

logging:
  level:
    com.reduceco2now: DEBUG